    <span class="icon-tile lg error-icon">
      <mat-icon>movie_off</mat-icon>
    </span>
    <h1 class="page-title">Pagina niet gevonden</h1>

      Deze scène is uit de film geknipt. De pagina die je zoekt bestaat niet of is verplaatst.
    </p>
    <div class="not-found-actions">
      <a mat-flat-button routerLink="/">
        <mat-icon>home</mat-icon>
        Naar home
      </a>
      <a mat-stroked-button routerLink="/movies">
        <mat-icon>movie</mat-icon>
        Films ontdekken
      </a>
    </div>
  </div>
</div>
