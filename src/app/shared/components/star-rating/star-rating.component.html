<div
  class="stars"
  [class]="containerClass()"
  [attr.role]="readonly() ? 'img' : 'slider'"
  [attr.aria-label]="readonly() ? ariaText(value()) : 'Beoordeling'"
  [attr.aria-valuemin]="readonly() ? null : 0"
  [attr.aria-valuemax]="readonly() ? null : 5"
  [attr.aria-valuenow]="readonly() ? null : value()"
  [attr.aria-valuetext]="readonly() ? null : ariaText(value())"
  [attr.tabindex]="readonly() ? null : 0"
  (keydown)="onKeydown($event)"
  (mouseleave)="clearHover()"
>
  @for (star of stars; track star) {
    @if (readonly()) {
      <span class="star" [style.--star-size.px]="size()">
        <mat-icon class="star-base">star</mat-icon>
        <mat-icon class="star-fill icon-filled" [style.clip-path]="fillClip(star)">star</mat-icon>
      </span>
    } @else {
      <button
        type="button"
        tabindex="-1"
        class="star star-btn"
        [style.--star-size.px]="size()"
        (mousemove)="onHover($event, star)"
        (click)="onSelect($event, star)"
        [attr.aria-hidden]="true"
      >
        <mat-icon class="star-base">star</mat-icon>
        <mat-icon class="star-fill icon-filled" [style.clip-path]="fillClip(star)">star</mat-icon>
      </button>
    }
  }
  @if (showValue() && value() > 0) {
    <span class="star-value">{{ format(value()) }}/5 · {{ label(value()) }}</span>
  }
</div>
