<div class="stars" [class.interactive]="!readonly()" [class]="containerClass()" (mouseleave)="clearHover()">
  @for (star of stars; track star) {
    @if (readonly()) {
      <mat-icon class="star" [class.on]="star <= activeValue()" [class.icon-filled]="star <= activeValue()" [style.font-size.px]="size()">star</mat-icon>
    } @else {
      <button
        type="button"
        class="star-btn"
        [style.--star-size.px]="size()"
        (mouseenter)="setHover(star)"
        (click)="select(star)"
        [attr.aria-label]="star + ' ster' + (star === 1 ? '' : 'ren') + ': ' + starLabel(star)"
        [attr.aria-pressed]="star <= value()"
      >
        <mat-icon class="star" [class.on]="star <= activeValue()" [class.icon-filled]="star <= activeValue()" [style.font-size.px]="size()">star</mat-icon>
      </button>
    }
  }
  @if (showValue() && value() > 0) {
    <span class="star-value">{{ value() }}/5 · {{ starLabel(value()) }}</span>
  }
</div>
