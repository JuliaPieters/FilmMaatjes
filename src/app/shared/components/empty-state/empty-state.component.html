<div class="empty-state" [class.compact]="compact()">
  @if (mascot()) {
    <app-mascot class="empty-mascot" [pose]="mascot()!" [size]="compact() ? 96 : 132" [float]="true" />
  } @else {
    <div class="empty-icon">
      <mat-icon>{{ icon() }}</mat-icon>
    </div>
  }
  <h3 class="empty-title">{{ title() }}</h3>
  @if (description()) {
    <p class="empty-description">{{ description() }}</p>
  }
  @if (actionLabel() && actionRoute()) {
    <a mat-flat-button [routerLink]="actionRoute()" class="empty-action">{{ actionLabel() }}</a>
  }
  <ng-content />
</div>
