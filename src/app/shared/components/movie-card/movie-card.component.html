<a [routerLink]="['/movies', movie().id]" class="movie-card" [attr.aria-label]="movie().title">
  <div class="poster">
    <img
      [src]="posterUrl()"
      [alt]="movie().title"
      class="poster-img"
      loading="lazy"
      decoding="async"
      (error)="onImageError($event)"
    />

    @if (movie().vote_average > 0) {
      <span class="score-badge">
        <mat-icon class="icon-filled">star</mat-icon>
        {{ movie().vote_average | number: '1.1-1' : 'nl' }}
      </span>
    }

    @if (showActions()) {
      <div class="poster-actions">
        <button
          type="button"
          class="poster-btn"
          [class.on-watchlist]="isInAnyWatchlist()"
          (click)="onAddToWatchlist($event)"
          [attr.aria-label]="isInAnyWatchlist() ? 'In watchlist' : 'Toevoegen aan watchlist'"
          [attr.aria-pressed]="isInAnyWatchlist()"
        >
          <mat-icon [class.icon-filled]="isInAnyWatchlist()">bookmark</mat-icon>
        </button>
        <button
          type="button"
          class="poster-btn secondary"
          [class.on-watched]="isWatched()"
          (click)="onMarkWatched($event)"
          [attr.aria-label]="isWatched() ? 'Gezien' : 'Markeer als gezien'"
          [attr.aria-pressed]="isWatched()"
        >
          <mat-icon [class.icon-filled]="isWatched()">check_circle</mat-icon>
        </button>
      </div>
    }

    @if (isWatched()) {
      <span class="watched-ribbon">
        <mat-icon class="icon-filled">visibility</mat-icon>
        Gezien
      </span>
    }
  </div>

  <div class="card-info">
    <h3 class="card-title">{{ movie().title }}</h3>
    <p class="card-year">{{ movieService.formatYear(movie().release_date) }}</p>
  </div>
</a>
