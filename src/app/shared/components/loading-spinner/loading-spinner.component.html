
    <div class="flex flex-col items-center justify-center gap-4" [style.min-height]="minHeight()">
      <mat-progress-spinner
        mode="indeterminate"
        [diameter]="diameter()"
        color="accent"
      />
      @if (message()) {
        <p class="text-text-secondary text-sm animate-pulse">{{ message() }}</p>
      }
    </div>
