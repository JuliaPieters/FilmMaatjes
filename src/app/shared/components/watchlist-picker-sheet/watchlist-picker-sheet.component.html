    <div class="sheet">
      <div class="sheet-header">
        <h3 class="sheet-title">Toevoegen aan watchlist</h3>
        <button type="button" class="sheet-close" (click)="close()">
          <mat-icon>close</mat-icon>
        </button>
      </div>
      @if (watchlistService.watchlists().length === 0) {
        <p class="sheet-empty">Je hebt nog geen watchlists.</p>
      } @else {
        <div class="sheet-list">
          @for (watchlist of watchlistService.watchlists(); track watchlist.id) {
            <button type="button" class="sheet-item" (click)="toggle(watchlist.id)">
              <span class="sheet-item-icon" [class.active]="isIn(watchlist.id)">
                <mat-icon>{{ isIn(watchlist.id) ? 'bookmark' : 'bookmark_add' }}</mat-icon>
              </span>
              <span class="sheet-item-name">{{ watchlist.name }}</span>
              @if (isIn(watchlist.id)) {
                <mat-icon class="sheet-item-check">check</mat-icon>
              }
            </button>
          }
        </div>
      }
    </div>
